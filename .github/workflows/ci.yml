name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test-build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27" # latest 1.27.x; keep in sync with go.mod and the Dockerfile
          cache: true

      - name: Verify dependencies
        run: go mod verify

      # Action v7+ is required for golangci-lint v2; v2.13+ supports Go 1.27.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          args: --timeout=5m

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o server ./cmd/main.go

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-test-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lightweight-security-monitoring:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

