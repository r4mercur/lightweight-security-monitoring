apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-monitor
automountServiceAccountToken: false # the monitor never talks to the Kubernetes API
---
# Events and alerts are stored in SQLite on this volume. It must be block
# storage (Longhorn, Ceph RBD, cloud disks, local-path), never NFS/CephFS/
# Azure Files: SQLite's file locking does not work on network file systems.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: security-monitor-data
  labels:
    app.kubernetes.io/name: security-monitor
spec:
  accessModes: ["ReadWriteOnce"] # ReadWriteOncePod if your CSI driver supports it
  # storageClassName: longhorn    # omit to use the cluster's default class
  resources:
    requests:
      storage: 2Gi # ~0.6 KiB per event: MAX_EVENTS=1000000 needs ~600 MiB, plus alerts and headroom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-monitor
  labels:
    app.kubernetes.io/name: security-monitor
spec:
  # Rule windows live in memory and the SQLite file allows one writer: run
  # exactly one instance. Recreate stops the old pod before the new one opens
  # the database (ReadWriteOnce alone allows two pods on the same node).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: security-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-monitor
    spec:
      serviceAccountName: security-monitor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534 # makes the data volume writable
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: security-monitor
          image: security-monitor # set in kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            # One key per client (Fluent Bit, each team's services) so keys can be rotated separately.
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: security-monitor
                  key: api-keys
            # AI analysis switches on by itself when the secret contains this key.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: security-monitor
                  key: anthropic-api-key
                  optional: true
            # Web UI at /ui/ (user "admin"); without this key in the secret the UI is off.
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: security-monitor
                  key: ui-password
                  optional: true
            - name: AI_MIN_SEVERITY # only analyze high and critical alerts (cost)
              value: high
            - name: DB_PATH # persist events and alerts, see README "Storage"
              value: /data/monitoring.db
            - name: MAX_EVENTS # on disk, ~0.6 KiB per event; size the volume for it
              value: "1000000"
            - name: GOMEMLIMIT # let the Go GC keep the heap below the container limit
              value: 400MiB
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: security-monitor-data
---
apiVersion: v1
kind: Service
metadata:
  name: security-monitor
  labels:
    app.kubernetes.io/name: security-monitor
spec:
  selector:
    app.kubernetes.io/name: security-monitor
  ports:
    - name: http
      port: 8080
      targetPort: http
