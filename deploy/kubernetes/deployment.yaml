apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-monitor
automountServiceAccountToken: false # the monitor never talks to the Kubernetes API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-monitor
  labels:
    app.kubernetes.io/name: security-monitor
spec:
  # Events, alerts and rule windows live in memory: run exactly one instance.
  # Recreate avoids two pods with diverging state during an update.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: security-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-monitor
    spec:
      serviceAccountName: security-monitor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: security-monitor
          image: security-monitor # set in kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            # One key per client (Fluent Bit, each team's services) so keys can be rotated separately.
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: security-monitor
                  key: api-keys
            # AI analysis switches on by itself when the secret contains this key.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: security-monitor
                  key: anthropic-api-key
                  optional: true
            - name: AI_MIN_SEVERITY # only analyze high and critical alerts (cost)
              value: high
            - name: MAX_EVENTS # ~0.9 KiB per event, see README "Storage"
              value: "200000"
            - name: GOMEMLIMIT # let the Go GC keep the heap below the container limit
              value: 400MiB
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: security-monitor
  labels:
    app.kubernetes.io/name: security-monitor
spec:
  selector:
    app.kubernetes.io/name: security-monitor
  ports:
    - name: http
      port: 8080
      targetPort: http
